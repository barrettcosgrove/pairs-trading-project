# Declares all Python dependencies and project metadata. Managed by uv or poetry. Pin exact versions for reproducibility.

[project]
name = "arq-pairs-trading"
version = "0.1.0"
description = "Systematic market-neutral pairs trading strategy on US technology stocks using K-means clustering and cointegration-based signal generation"
requires-python = ">=3.11"

dependencies = [
    # Data acquisition and storage
    "yfinance>=0.2.40",
    "curl-cffi>=0.6.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pyarrow>=15.0.0",
    # Machine learning and clustering
    "scikit-learn>=1.4.0",
    # Statistical testing (Johansen, KPSS, OLS)
    "statsmodels>=0.14.0",
    # Visualization
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "lxml>=6.1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pandas-stubs>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pandas-stubs>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--tb=short -q"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
